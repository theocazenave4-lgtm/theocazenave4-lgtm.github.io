<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>King Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one-screen game. A 9:16 stage is fitted inside the viewport; HUD and menus are DOM layers over the canvas. */
:root {
  --ground: #13221b;
  --ink: #f3f8f1;
  --muted: #a9c2b4;
  --panel: rgba(9, 24, 17, 0.82);
  --gold: #f5b82e;
  --gold-d: #c88a0a;
  --gold-ink: #2b1d00;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  padding-block: 0;
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app { height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; }
.stage {
  position: relative;
  width: 360px;
  height: 640px;
  border-radius: 0;
  overflow: hidden;
  container-type: inline-size;
  background: #7cc8f0;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: absolute; inset: 0 0 auto 0;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 2.8cqw 3.2cqw; pointer-events: none;
}
.hud-left { display: flex; gap: 1.8cqw; flex-wrap: wrap; }
.bravo { position: absolute; left: 50%; top: 46cqw; transform: translateX(-50%); z-index: 4; max-width: 88cqw; text-align: center;
  padding: 3cqw 5cqw; border-radius: 6cqw; background: rgba(20, 14, 0, 0.78); border: 0.6cqw solid #ffd24a; color: #ffe27a;
  font: 700 5.4cqw/1.2 var(--font-display); text-wrap: balance; box-shadow: 0 0 20px rgba(255, 190, 40, 0.55); pointer-events: none; animation: bravoIn 0.35s ease-out; }
@keyframes bravoIn { from { opacity: 0; transform: translateX(-50%) scale(0.8); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
.pill.coin2 { color: #ffe27a; border: 1px solid rgba(255, 205, 60, 0.6); box-shadow: 0 0 14px rgba(255, 190, 40, 0.45); }
.pill.boost { color: #8fdcff; border: 1px solid rgba(80, 200, 255, 0.55); box-shadow: 0 0 14px rgba(40, 170, 255, 0.45); }
.pill {
  display: flex; align-items: center; gap: 1.6cqw;
  background: rgba(9, 24, 17, 0.62);
  border-radius: 999px;
  padding: 1.3cqw 3.2cqw;
  font: 700 5cqw/1 var(--font-display);
  font-variant-numeric: tabular-nums;
}
.pill small { font: 500 3.4cqw/1 var(--font-body); color: var(--muted); }
.coin-ico {
  width: 4.8cqw; height: 4.8cqw; flex: none; display: inline-block;
  background: url('coin.png') center / contain no-repeat;
}
.bump { animation: bump 0.22s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
.round {
  pointer-events: auto;
  width: 10.5cqw; height: 10.5cqw; border-radius: 50%;
  background: rgba(9, 24, 17, 0.62); border: 0; color: var(--ink);
  display: grid; place-items: center; cursor: pointer;
}
.round svg { width: 4.6cqw; height: 4.6cqw; fill: currentColor; }
.speed {
  position: absolute; right: 3.2cqw; top: 17cqw; width: 10.5cqw;
  display: flex; flex-direction: column; align-items: center; gap: 1.6cqw; pointer-events: none;
}
.speed-label { font: 700 2.7cqw/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5); }
.bar { width: 4cqw; height: 52cqw; border-radius: 99px; background: rgba(9, 24, 17, 0.55); overflow: hidden; display: flex; align-items: flex-end; }
.fill { width: 100%; height: 0; border-radius: 99px; background: linear-gradient(0deg, #7fd16a, var(--gold)); }
.speed.max .speed-label { color: var(--gold); }
.speed.max .fill { background: var(--gold); }

.screen {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 6cqw; background: rgba(5, 14, 10, 0.34);
}
.menu {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: linear-gradient(to bottom, rgba(5, 14, 10, 0.62), rgba(5, 14, 10, 0) 46%);
}
.menu-top { display: flex; flex-direction: column; align-items: center; gap: 2.2cqw; padding: 7cqw 6cqw 0; text-align: center; }
.menu-top h1 { color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4); }
.menu-stats { display: flex; gap: 2.4cqw; }
.menu-mid { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 4cqw 7cqw 3cqw; overflow-y: auto; overscroll-behavior: contain; }
.panel { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 3.4cqw; text-align: center; }
.panel .keys { background: rgba(9, 24, 17, 0.55); border-radius: 3cqw; padding: 2.4cqw 3.4cqw; }
.btn.big { font-size: 6.4cqw; padding: 4.2cqw 12cqw; border-radius: 4cqw; box-shadow: 0 1.6cqw 0 var(--gold-d); }
.panel.soon { background: var(--panel); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 5cqw; padding: 5cqw; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.tabbar {
  display: flex; gap: 1cqw; justify-content: center;
  padding: 2cqw 2cqw calc(2cqw + env(safe-area-inset-bottom, 0px));
  background: var(--panel); border-top: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.tab {
  flex: 1 1 0; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 1cqw;
  background: transparent; border: 0; border-radius: 3cqw; padding: 1.8cqw 0;
  color: var(--muted); font: 600 2.8cqw/1 var(--font-body); cursor: pointer; white-space: nowrap;
}
.tab svg { width: 6cqw; height: 6cqw; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--gold-ink); background: var(--gold); }
.quest {
  width: 100%; text-align: left;
  background: var(--panel); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 5cqw;
  padding: 4.5cqw 5cqw; display: flex; flex-direction: column; gap: 3cqw;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.quest h3 { margin: 0; font: 700 5.6cqw/1.15 var(--font-display); letter-spacing: -0.01em; }
.quest-head, .quest-foot { display: flex; justify-content: space-between; align-items: center; gap: 3cqw; }
.quest-timer { font: 500 3.2cqw/1 var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; }
.qbar { height: 3.6cqw; border-radius: 99px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
.qfill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #7fd16a, var(--gold)); }
.quest-foot { font: 600 3.8cqw/1 var(--font-body); font-variant-numeric: tabular-nums; }
.reward { display: flex; align-items: center; gap: 1.6cqw; color: var(--gold); font-family: var(--font-display); font-weight: 700; font-size: 4.6cqw; }
.quest-list { width: 100%; display: flex; flex-direction: column; gap: 3cqw; }
.quest.empty { text-align: center; align-items: center; }
.quest.empty b { color: var(--gold); font-variant-numeric: tabular-nums; }
.toast {
  position: absolute; left: 50%; top: 17cqw; transform: translateX(-50%);
  background: var(--gold); color: var(--gold-ink); border-radius: 99px;
  padding: 2.4cqw 5cqw; font: 700 4cqw/1.2 var(--font-display); text-align: center;
  box-shadow: 0 2cqw 6cqw rgba(0, 0, 0, 0.35); pointer-events: none; max-width: 90%; z-index: 5;
}
/* Vestiaire : 2 skins par ligne */
.wardrobe { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3cqw; }
.skin {
  min-width: 0; display: flex; align-items: center; gap: 2.2cqw;
  background: var(--panel); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 4cqw;
  padding: 2.6cqw; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.skin.on { border-color: var(--gold); }
.skin img { width: 12cqw; height: auto; flex: none; display: block; }
.skin-info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2.4cqw; align-items: stretch; }
.skin-name { font: 700 3.5cqw/1.1 var(--font-display); overflow-wrap: normal; white-space: normal; text-wrap: balance; }
.equip {
  font: 700 3.3cqw/1 var(--font-body); padding: 2.2cqw 1cqw; border-radius: 2.4cqw; border: 0;
  background: var(--gold); color: var(--gold-ink); cursor: pointer;
}
.equip[disabled] { background: transparent; color: var(--gold); border: 1px solid var(--gold); cursor: default; }
.price { display: flex; align-items: center; gap: 1.2cqw; font: 700 3.6cqw/1 var(--font-display); color: var(--gold); font-variant-numeric: tabular-nums; }
.need { font: 600 3cqw/1.15 var(--font-body); color: #ffb4a8; }
.price .coin-ico { width: 3.6cqw; height: 3.6cqw; }
.tab em { font: 500 2.5cqw/1 var(--font-body); font-style: normal; opacity: 0.85; }
.card {
  width: 100%;
  background: var(--panel);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 5cqw;
  padding: 6cqw 6cqw 5.5cqw;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 3.2cqw;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.tag { font: 600 3cqw/1 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
h1, h2 { margin: 0; font-family: var(--font-display); letter-spacing: -0.02em; line-height: 1.05; text-wrap: balance; }
h1 { font-size: 10.5cqw; }
h2 { font-size: 8.5cqw; }
.sub { margin: 0; font-size: 3.9cqw; line-height: 1.45; color: var(--muted); max-width: 46ch; }
.stats { display: flex; gap: 8cqw; justify-content: center; }
.stats div { display: flex; flex-direction: column; gap: 0.8cqw; align-items: center; }
.stats b { font: 700 7cqw/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 3cqw; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.record { font: 600 3.4cqw/1 var(--font-body); color: var(--gold-ink); background: var(--gold); padding: 1.3cqw 3cqw; border-radius: 99px; }
.btn {
  font: 700 5cqw/1 var(--font-display);
  background: var(--gold); color: var(--gold-ink);
  border: 0; border-radius: 3.2cqw;
  padding: 3.4cqw 9cqw; cursor: pointer; margin-top: 1cqw;
  box-shadow: 0 1.2cqw 0 var(--gold-d);
}
.btn:active { transform: translateY(0.6cqw); box-shadow: 0 0.6cqw 0 var(--gold-d); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: none; border: 1px solid rgba(255, 255, 255, 0.28); font-size: 4cqw; padding: 2.6cqw 6cqw; margin-top: 0; }
.row { display: flex; gap: 2.5cqw; flex-wrap: wrap; justify-content: center; }
.keys { margin: 0; font-size: 3.3cqw; line-height: 1.45; color: var(--muted); }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .bump { animation: none; } }
</style>

<div class="app" id="app">
  <div class="stage" id="stage">
    <canvas id="game" aria-label="Zone de jeu"></canvas>

    <div class="bravo" id="bravo" hidden></div>
    <div class="hud" id="hud" hidden>
      <div class="hud-left">
        <div class="pill"><span id="dist">0</span><small>m</small></div>
        <div class="pill boost" id="boostPill" hidden><span id="boostTxt">×2</span></div>
        <div class="pill" id="coinPill"><i class="coin-ico"></i><span id="coins">0</span></div>
        <div class="pill coin2" id="c2Pill" hidden><span id="c2Txt">×2 pièces</span></div>
      </div>
      <button class="round" id="pauseBtn" type="button" aria-label="Pause">
        <svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
      </button>
    </div>
    <div class="speed" id="speed" hidden>
      <span class="speed-label" id="speedLabel">Vitesse</span>
      <div class="bar"><div class="fill" id="speedFill"></div></div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <div class="menu" id="menu">
      <div class="menu-top">
        <span class="tag">Course infinie</span>
        <h1>King Rush</h1>
        <div class="menu-stats">
          <div class="pill"><small>Record</small><span id="mBest">0</span><small>m</small></div>
          <div class="pill"><i class="coin-ico"></i><span id="mBank">0</span></div>
        </div>
      </div>
      <div class="menu-mid" id="tabPanel">
        <section class="panel" id="panel-home">
          <button class="btn big" id="playBtn" type="button">Commencer</button>
          <p class="keys">Glisse le doigt vers la gauche ou la droite pour changer de voie, vers le haut pour sauter, vers le bas pour glisser. Au clavier, utilise les flèches.</p>
        </section>
        <section class="panel" id="panel-quests" hidden>
          <div class="quest-list" id="questList"></div>
        </section>
        <section class="panel" id="panel-shop" hidden>
          <div class="pill"><i class="coin-ico"></i><span id="shopBank">0</span><small>pièces</small></div>
          <div class="wardrobe" id="shopGrid"></div>
        </section>
        <section class="panel" id="panel-wardrobe" hidden>
          <div class="wardrobe" id="wardrobe"></div>
        </section>
        <section class="panel" id="panel-chars" hidden>
          <div class="wardrobe" id="charGrid"></div>
        </section>
      </div>
      <nav class="tabbar" id="tabbar" aria-label="Menu principal"></nav>
    </div>

    <div class="screen" id="pauseScreen" hidden>
      <div class="card">
        <h2>Pause</h2>
        <div class="row">
          <button class="btn" id="resumeBtn" type="button">Reprendre</button>
          <button class="btn ghost" id="quitBtn" type="button">Quitter</button>
        </div>
      </div>
    </div>

    <div class="screen" id="over" hidden>
      <div class="card">
        <h2 id="overTitle">Raté !</h2>
        <p class="sub" id="overTip"></p>
        <div class="stats">
          <div><b id="oDist">0</b><span>Mètres</span></div>
          <div><b id="oCoins">0</b><span>Pièces</span></div>
        </div>
        <span class="record" id="oRecord" hidden>Nouveau record !</span>
        <div class="row">
          <button class="btn" id="againBtn" type="button">Rejouer</button>
          <button class="btn ghost" id="menuBtn" type="button">Menu</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Réglages (à modifier facilement pour les mises à jour) ---------- */
  var CFG = {
    START_SPEED: 11,      // vitesse de départ (unités par seconde)
    MAX_SPEED: 30,        // limite de vitesse
    ACCEL: 0.0063,        // gain de vitesse par mètre : la vitesse max est atteinte vers 3000 m
    GRAVITY: 38,          // plus fort = saut plus rapide
    JUMP_H: 1.25,         // hauteur du saut
    SLIDE_TIME: 0.5,
    LANE_SMOOTH: 20,
    SPAWN_AHEAD: 150,
    FIRST_OBSTACLE: 55,
    BIG_COIN_CHANCE: 0.16, // chance qu'une grosse pièce apparaisse entre deux rangées d'obstacles (environ une tous les 200 m)
    BIG_COIN_VALUE: 10,
    MEGA_COIN_CHANCE: 0.06, // énorme pièce à 35 (environ une tous les 1 km)
    MEGA_COIN_VALUE: 35,
    LEGEND_EVERY: 10,       // toutes les 10 s de jeu (compteur caché)...
    LEGEND_CHANCE: 0.035,   // ...3,5 % de chance de voir apparaître la pièce légendaire
    LEGEND_VALUE: 150,
    GIANT_EVERY: 5,         // pièce gigantesque : toutes les 5 s de jeu (compteur caché)...
    GIANT_CHANCE: 0.005,    // ...0,5 % de chance
    GIANT_VALUE: 500,
    BOOST_EVERY: 5,         // boule bleue : toutes les 5 s de jeu (compteur caché)...
    BOOST_CHANCE: 0.05,     // ...5 % de chance qu'elle apparaisse
    BOOST_TIME: 10,         // durée du boost (secondes)
    BOOST_MULT: 2,          // les mètres comptent x2 pendant le boost
    COIN2_EVERY: 5,         // pièce x2 : toutes les 5 s de jeu (compteur caché)...
    COIN2_CHANCE: 0.05,     // ...5 % de chance qu'elle apparaisse
    COIN2_TIME: 10,         // durée (secondes) pendant laquelle les pièces valent x2
    COIN2_MULT: 2,
    // plus on avance, plus il y a d'obstacles : 'gap' = écart entre deux rangées (plus petit = plus dense), 'dbl' = chance de 2 obstacles dans la même rangée
    OBSTACLE_TIERS: [
      { at: 5000,  gap: 0.75, dbl: 0.50 },
      { at: 10000, gap: 0.66, dbl: 0.62 }
    ],
    // pièces récompense : une de chaque par course, quand on atteint les mètres affichés 'at'
    REWARDS: [
      { at: 10000, value: 250, msg: 'Bravo, tu as atteint 10000 mètres !' },
      { at: 30000, value: 300, msg: "Mais t'es trop fort toi, abandonne pas !" }
    ],
    // messages affichés à certains paliers (mètres affichés), sans pièce
    MILESTONES: [
      { at: 50000,  time: 5, msg: 'Bien joué, il te reste infini mètres !' },
      { at: 100000, time: 5, msg: "C'est du cheat à ce niveau-là ? T'as pas mal aux yeux ?" }
    ],
    // jackpot : au départ d'une course, petite chance de voir un message puis une pluie de pièces
    JACKPOT_CHANCE: 0.01,   // 1 %
    JACKPOT_MSG: 'Elle c\'est la bonne\u00a0!',
    JACKPOT_MSG_TIME: 3,
    JACKPOT_START: 15,      // la pluie commence à 15 m
    JACKPOT_LEN: 150,       // ... et dure 150 m
    // à chaque mètre parcouru : 100 % de chance de gagner 100 pièces (actif seulement quand meterLuck est vrai)
    METER_LUCK_CHANCE: 1,
    METER_LUCK_VALUE: 100,
    REWARD_MSG_TIME: 3,     // secondes d'affichage du message
    GIFT_COUNT: 100         // nombre de pièces gigantesques du cadeau unique
  };
  var OBST = {
    barrier: { w: 0.62, d: 0.55, bottom: 0,   top: 0.62, weight: 0.4, tip: 'Trop bas ! Il fallait sauter par-dessus la barrière.' },
    rock:    { w: 0.66, d: 0.55, bottom: 0,   top: 1.5,  weight: 0.3, tips: ['Bah non, tu peux pas résister face au rocher.', 'Je t\'ai dit quoi, mon gars ? Les rochers font mal.'] },
    gate:    { w: 0.62, d: 0.45, bottom: 1.1, top: 1.5,  weight: 0.3, tip: 'Trop haut ! Il fallait glisser sous la poutre.' }
  };
  /* Personnage : photo de dos en pleine course ; l'image retournée donne l'autre pas. */
  var SKINS = [
    { id: 'king', name: 'King', src: 'runner-back.png', w: 211, h: 440 }
    /* Nouveau skin : { id: 'xxx', name: 'Nom', src: 'image.png', w: largeur, h: hauteur } */
  ];
  /* Personnages à acheter (onglet Personnages). Le prix pourra augmenter avec le nombre de personnages possédés. */
  var CHARS = [
    { id: 'molecarl', name: 'Molecarl', src: 'molecarl-back.png', preview: 'molecarl-front.png', w: 204, h: 436, price: 1000 },
    { id: 'ironlight', name: 'Iron Light', src: 'ironlight-back.png', preview: 'ironlight-front.png', w: 199, h: 440, price: 1500 },
    { id: 'hana', name: 'Hana', src: 'hana-back.png', preview: 'hana-front.png', w: 210, h: 440, price: 2000 },
    { id: 'fozi', name: 'Fozi', src: 'fozi-back.png', preview: 'fozi-front.png', w: 216, h: 440, price: 2500 },
    { id: 'tajia', name: 'Tajia', src: 'tajia-back.png', preview: 'tajia-front.png', w: 186, h: 440, price: 3000 }
  ];
  /* Skins vendus dans la Boutique : il faut posséder le personnage ('of') pour les acheter, ils vont ensuite dans le Vestiaire. */
  var SHOP_SKINS = [
    { id: 'molecarl-gluant', name: 'Molecarl gluant', of: 'molecarl', src: 'gluant-back.png', preview: 'gluant-front.png', w: 216, h: 440, price: 800 },
    { id: 'hana-hivernal', name: 'Hana hivernal', of: 'hana', src: 'hivernal-back.png', preview: 'hivernal-front.png', w: 240, h: 440, price: 1500 }
  ];

    }
    if (o.boost) {                                                            /* boule bleue : boost de mètres */
      var by = gy - o.h * u - Math.sin(time * 4) * 0.07 * u, hs = 1.5 * u * (1 + 0.07 * Math.sin(time * 5));
      if (boostReady) ctx.drawImage(boostImg, sx - hs, by - hs, hs * 2, hs * 2);
      else { ctx.fillStyle = '#26b6ff'; ctx.beginPath(); ctx.arc(sx, by, 0.4 * u, 0, 6.3); ctx.fill(); }
      return;
    }
    var cy = gy - o.h * u, r = (o.giant ? 1.3 : o.legend ? 0.9 : o.mega ? 0.75 : o.big ? 0.5 : 0.3) * u;
    if (o.big) {                                                              /* grosse pièce : plus grande, flotte et brille */
      cy -= Math.sin(time * 4) * 0.07 * u;
    }
    var wid = Math.max(0.14, Math.abs(Math.cos(time * 6 + o.wz))) * r;      /* la pièce tourne sur elle-même */
    if (o.giant && giantReady) { var gw = wid * 1.64, gh = r * 1.64 * 365 / 480; ctx.drawImage(giantImg, sx - gw, cy - gh, gw * 2, gh * 2); return; }
    if (o.legend && legReady) { var lw = wid * 1.5, lh = r * 1.5; ctx.drawImage(legImg, sx - lw, cy - lh, lw * 2, lh * 2); return; }
    if (o.mega && megaReady) { var mw = wid * 1.5, mh = r * 1.5; ctx.drawImage(megaImg, sx - mw, cy - mh, mw * 2, mh * 2); return; }
    if (o.big && bigReady) { var bw = wid * 1.1, bh = r * 1.1; ctx.drawImage(bigImg, sx - bw, cy - bh, bw * 2, bh * 2); return; }
    if (coinReady) { ctx.drawImage(coinImg, sx - wid, cy - r, wid * 2, r * 2); return; }
    ctx.fillStyle = '#f5b82e';
    ctx.beginPath(); ctx.ellipse(sx, cy, wid, r, 0, 0, 6.283); ctx.fill();
  }
  var DRAW = { barrier: drawBarrier, rock: drawRock, gate: drawGate };

  /* ---------- Dessin : personnage ---------- */
  function drawPlayer() {
    var x = CX + px * U, gy = FEET - jy * U;
    var air = Math.min(jy, 1.4);
    ctx.fillStyle = 'rgba(0,0,0,' + (0.3 * (1 - air * 0.3)) + ')';
    ctx.beginPath(); ctx.ellipse(x, FEET + 3, 25 * (1 - air * 0.25), 7 * (1 - air * 0.25), 0, 0, 6.283); ctx.fill();
    if (!imgReady) return;
    var k = SPR_H / skin.h;
    var sliding = slideT > 0 && jy === 0;
    var bob = 0, lean = 0, sx = 1, sy = 1, flip = false;
    if (state === 'dead') {
      lean = -Math.min(deathT * 6, 1.4);
    } else if (jy > 0) {
      sy = 1 + clamp(vy, -10, 10) * 0.008; sx = 2 - sy; lean = -0.08;
    } else if (sliding) {
      sy = 0.55; sx = 1.14;
    } else {
      var sn = Math.sin(runPhase);
      flip = sn < 0;                     /* l'image retournée donne l'autre pas de course */
      bob = Math.abs(sn) * 7;
      lean = sn * 0.04;
    }
    ctx.save();
    ctx.translate(x, gy - bob);
    ctx.rotate(lean);
    ctx.scale(k * sx * (flip ? -1 : 1), k * sy);
    ctx.drawImage(img, -skin.w / 2, -skin.h, skin.w, skin.h);
    ctx.restore();
  }

  /* ---------- Rendu ---------- */
  var pool = [], list = [], cnt = 0;
  function add(z, t, a, b, c) {
    var it = pool[cnt] || (pool[cnt] = {});
    it.z = z; it.t = t; it.a = a; it.b = b; it.c = c;
    cnt++;
  }
  var treeCache = {};
  function treeFor(k, side) {
    var key = k * 2 + (side > 0 ? 1 : 0), t = treeCache[key];
    if (!t) {
      t = treeCache[key] = { kind: hash(k * 13.3 + side) > 0.45 ? 0 : 1, size: 0.85 + hash(k * 2.9 + side * 5) * 0.5, col: Math.floor(hash(k * 4.4 + side) * 3) % 3 };
    }
    return t;
  }
  function collect() {
    cnt = 0;
    var kMin = Math.floor((dist - 6) / 6.5), kMax = Math.ceil((dist + 150) / 6.5), k, side;
    for (k = kMin; k <= kMax; k++) {
      for (side = -1; side <= 1; side += 2) {
        var hs = hash(k * 3.17 + side * 11.3);
        if (hs < 0.22) continue;
        var wz = k * 6.5 + hash(k * 1.7 + side) * 3, z = wz - dist;
        if (z < -3 || z > 150) continue;
        var off = BR + 1.6 + hash(k * 5.1 + side * 2.2) * 3.8, rw = riverW(wz);
        if (rw > 0.03) off = Math.max(off, BR + 0.35 + rw * 3.6 + 1.1 + hash(k * 9.1) * 1.2);
        add(z, 0, side, off, treeFor(k, side));
      }
    }
    var pMin = Math.floor((dist - 4) / 6), pMax = Math.ceil((dist + 150) / 6);
    for (k = pMin; k <= pMax; k++) {
      var zp = k * 6 - dist;
      if (zp < -4 || zp > 150) continue;
      add(zp, 1, -1); add(zp, 1, 1);
    }
    for (var i = 0; i < objs.length; i++) {
      var o = objs[i], zo = o.wz - dist;
      if (zo > 150 || zo < -5) continue;
      add(zo, 2, o);
    }
    add(0, 3);
    list.length = 0;
    for (var j = 0; j < cnt; j++) list.push(pool[j]);
    list.sort(function (a, b) { return b.z - a.z; });
  }
  function drawItem(it) {
    var p;
    if (it.t === 0) { p = proj(it.z); drawTree(CX + it.a * it.b * U * p.s, p.y, U * p.s, it.c); }
    else if (it.t === 1) { p = proj(it.z); drawPost(CX + it.a * BR * U * p.s, p.y, U * p.s); }
    else if (it.t === 2) {
      var o = it.a; p = proj(it.z);
      var sx = CX + (o.lane - 1) * U * p.s, u = U * p.s;
      if (o.type === 'coin') drawCoin(sx, p.y, u, o); else DRAW[o.type](sx, p.y, u);
    } else drawPlayer();
  }
  function drawSpeedLines() {
    var ratio = clamp((speed - CFG.START_SPEED) / (CFG.MAX_SPEED - CFG.START_SPEED), 0, 1);
    if (ratio < 0.3 || state === 'menu') return;
    ctx.lineCap = 'round';
    for (var i = 0; i < 14; i++) {
      var left = i % 2 === 0;
      var tx = left ? -120 + hash(i * 3.1) * 150 : W - 30 + hash(i * 3.1) * 150;
      var t = (time * (0.9 + hash(i) * 0.7) + hash(i * 7.7)) % 1, t2 = t + 0.1;
      var x1 = CX + (tx - CX) * t * t, y1 = HZ + (H - HZ) * t * t;
      var x2 = CX + (tx - CX) * t2 * t2, y2 = HZ + (H - HZ) * t2 * t2;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.22 * ratio * t) + ')';
      ctx.lineWidth = 1 + 2.5 * t;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }
  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    drawSky(); drawMountains(); drawGround(); drawRails();
    collect();
    var ga = 1;
    for (var i = 0; i < list.length; i++) {
      var it = list[i], al = it.z > 100 ? clamp((140 - it.z) / 40, 0, 1) : 1;
      if (al !== ga) { ctx.globalAlpha = al; ga = al; }
      drawItem(it);
    }
    ctx.globalAlpha = 1;
    drawSpeedLines();
    ctx.fillStyle = '#ffd24a';
    for (var j = 0; j < sparks.length; j++) {
      var s = sparks[j];
      ctx.globalAlpha = clamp(s.life / 0.45, 0, 1);
      ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    if (floaters.length) {
      ctx.font = '700 26px "Space Grotesk", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,35,0,0.85)';
      for (var q = 0; q < floaters.length; q++) {
        var fl = floaters[q]; ctx.globalAlpha = clamp(fl.t / 0.4, 0, 1);
        ctx.strokeText(fl.txt, fl.x, fl.y); ctx.fillStyle = '#ffd24a'; ctx.fillText(fl.txt, fl.x, fl.y);
      }
      ctx.globalAlpha = 1;
    }
  }

  /* ---------- Taille de l'écran ---------- */
  function fit() {
    var r = app.getBoundingClientRect();
    var w = Math.max(160, Math.min(r.width, 560));
    var h = Math.min(r.height, w * 2.05);
    if (h < w * 1.2) { h = Math.max(220, r.height); w = Math.min(w, h / 1.2); }
    stage.style.width = w + 'px'; stage.style.height = h + 'px';
    setH(clamp(W * h / w, 520, 960));
    dpr = Math.min(window.devicePixelRatio || 1, 2, 820 / w);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    scale = canvas.width / W;
    canvas.height = Math.round(h * dpr);
    makeGradients();
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);

  /* ---------- Commandes ---------- */
  /* Un glissé = une seule action : on déclenche dès que le doigt a bougé assez, puis on attend un nouveau toucher. */
  var sid = null, sx0 = 0, sy0 = 0;
  canvas.addEventListener('pointerdown', function (e) {
    sid = e.pointerId; sx0 = e.clientX; sy0 = e.clientY;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    if (e.pointerId !== sid) return;
    var dx = e.clientX - sx0, dy = e.clientY - sy0;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    sid = null;
    if (Math.abs(dx) > Math.abs(dy)) act(dx > 0 ? 'right' : 'left'); else act(dy > 0 ? 'down' : 'up');
  });
  function endSwipe(e) { if (e.pointerId === sid) sid = null; }
  canvas.addEventListener('pointerup', endSwipe);
  canvas.addEventListener('pointercancel', endSwipe);

  document.addEventListener('keydown', function (e) {
    var map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down', q: 'left', z: 'up' };
    if (map[e.key]) { e.preventDefault(); act(map[e.key]); return; }
    if (e.key === ' ' || e.key === 'Enter') {
      if (state === 'menu' || state === 'dead') { e.preventDefault(); if (state === 'menu' || overShown) startGame(); }
      else if (state === 'paused') { e.preventDefault(); resumeGame(); }
    } else if (e.key === 'p' || e.key === 'Escape') {
      if (state === 'playing') pauseGame(); else if (state === 'paused') resumeGame();
    }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame(); });

  $('playBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);
  $('menuBtn').addEventListener('click', toMenu);
  $('pauseBtn').addEventListener('click', pauseGame);
  $('resumeBtn').addEventListener('click', resumeGame);
  $('quitBtn').addEventListener('click', function () {
    if (state === 'paused') { var m = Math.floor(dist + extra); if (m > save.best) save.best = m; save.bank += coins; persist(); }
    toMenu();
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) persist(); });

  /* ---------- Boucle principale ---------- */
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (state !== 'paused') update(dt);
    render();
    requestAnimationFrame(frame);
  }

  fit();
  toMenu();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
